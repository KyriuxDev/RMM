<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:p="primefaces"
                template="/plantillas/plantillaPrincipal.xhtml">

    <ui:param name="seccion" value="tableros"/>
    <ui:param name="subseccion" value="vista-general"/>
    <ui:param name="migaSeccion" value="Tableros"/>
    <ui:param name="migaEnlace" value="/vista/tableros/vista-general"/>
    <ui:param name="migaPagina" value="Vista general"/>
    <ui:param name="titulo" value="Vista general"/>

    <ui:define name="estilos">
        <h:outputStylesheet library="css" name="tableros/vista-general.css"/>
    </ui:define>


    <ui:define name="content">
        <section class="tarjeta t-mapa">
            <div class="tarjeta-titulo">
                <h2>Geomapa</h2>
                <span class="mono tenue">17°04'N 96°43'W</span>
            </div>

            <div class="mapa-contenedor">
                <div id="mapaOaxaca"></div>

                <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
                <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
                <script>
                    var mapa = L.map('mapaOaxaca').setView([17.06, -96.72], 8);
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 18, attribution: '© OpenStreetMap'
                    }).addTo(mapa);
                </script>
            </div>
        </section>
    </ui:define>

</ui:composition>
