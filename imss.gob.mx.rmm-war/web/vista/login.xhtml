<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/plantillas/plantillaLogin.xhtml">

    <ui:define name="titulo">Iniciar sesión</ui:define>

    <ui:define name="content">
        <h:form id="formLogin" prependId="false">
            <div class="campo">
                <h:outputLabel for="usuario" value="Usuario"/>
                <h:inputText id="usuario"/>
            </div>

            <div class="campo">
                <h:outputLabel for="contrasena" value="Contraseña"/>
                <h:inputSecret id="contrasena"/>
            </div>

            <div class="recordarme">
                <input type="checkbox" id="recordarme" checked="checked"/>
                <label for="recordarme">Recordarme por 30 días</label>
            </div>

            <h:commandButton value="Iniciar sesión" styleClass="boton-primario"/>

            <div class="login-invitado">
                <h:link outcome="/vista/tablero" value="o ingresar como invitado"/>
            </div>
        </h:form>
    </ui:define>

</ui:composition>
