<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/plantillas/plantillaPrincipal.xhtml">

    <!-- Administración → Unidades (SD-07b Consultar catálogo de unidades)
         Cada fila es un área (unidad / servicio) de un hospital o sede (tabla unidad_homologada). -->
    <ui:param name="seccion" value="administracion"/>
    <ui:param name="subseccion" value="unidades"/>
    <ui:param name="migaSeccion" value="Administración"/>
    <ui:param name="migaPagina" value="Unidades"/>
    <ui:param name="titulo" value="Catálogo de unidades"/>

    <ui:define name="estilos">
        <h:outputStylesheet library="css" name="comun/formularios.css"/>
    </ui:define>

    <ui:define name="content">
        <h:form id="formUnidades" styleClass="vista-formulario">

            <p:messages id="mensajes" showSummary="true" showDetail="true" globalOnly="true" closable="true"/>

            <!-- consultarUnidades(filtro) -->
            <p:outputPanel id="panelFiltro" styleClass="tarjeta" layout="block">
                <div class="tarjeta-titulo">
                    <h2>Buscar unidades</h2>
                    <span class="tenue">Puede combinar los filtros</span>
                </div>

                <div class="filtros">
                    <div class="campo">
                        <p:outputLabel for="texto" value="Clave o nombre"/>
                        <p:inputText id="texto" value="#{unidadesCtrl.texto}" maxlength="100"
                                     placeholder="Ej. HGZ 1, Urgencias, 210101"
                                     validatorMessage="Escriba al menos 2 caracteres para buscar">
                            <f:validateLength minimum="2" maximum="100"/>
                        </p:inputText>
                        <p:message for="texto"/>
                    </div>

                    <div class="campo">
                        <p:outputLabel for="hospital" value="Hospital / sede"/>
                        <p:selectOneMenu id="hospital" value="#{unidadesCtrl.idUnidadHomologada}"
                                         filter="true" filterMatchMode="contains">
                            <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{unidadesCtrl.hospitales}" var="h"
                                           itemValue="#{h.idUnidadHomologada}" itemLabel="#{h.nombre}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="campo">
                        <p:outputLabel for="region" value="Región"/>
                        <p:selectOneMenu id="region" value="#{unidadesCtrl.idRegion}">
                            <f:selectItem itemLabel="Todas" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{unidadesCtrl.regiones}" var="r"
                                           itemValue="#{r.idRegion}" itemLabel="#{r.nombre}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="campo">
                        <p:outputLabel for="regimen" value="Régimen"/>
                        <p:selectOneMenu id="regimen" value="#{unidadesCtrl.regimen}">
                            <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{unidadesCtrl.regimenes}" var="g"
                                           itemValue="#{g}" itemLabel="#{g}"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="acciones">
                        <p:commandButton value="Limpiar" icon="pi pi-times"
                                         action="#{unidadesCtrl.limpiarFiltros}"
                                         process="@this" update="panelFiltro tablaUnidades" resetValues="true"
                                         styleClass="btn btn-secundario"/>
                        <p:commandButton value="Buscar" icon="pi pi-search"
                                         action="#{unidadesCtrl.consultarUnidades}"
                                         process="panelFiltro" update="panelFiltro tablaUnidades"
                                         styleClass="btn btn-primario"/>
                    </div>
                </div>
            </p:outputPanel>

            <!-- mostrarCatalogo(listaUnidades) -->
            <section class="tarjeta">
                <div class="tarjeta-titulo">
                    <h2>Unidades y servicios</h2>
                </div>

                <p:dataTable id="tablaUnidades" value="#{unidadesCtrl.unidades}" var="a"
                             rows="15" paginator="true" paginatorPosition="bottom"
                             paginatorAlwaysVisible="false"
                             currentPageReportTemplate="{totalRecords} unidades"
                             paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
                             emptyMessage="No hay unidades que coincidan con la búsqueda.">
                    <p:column headerText="Hospital / sede" sortBy="#{a.idUnidadHomologada.nombre}">
                        <h:outputText value="#{a.idUnidadHomologada.nombre}"/>
                    </p:column>
                    <p:column headerText="Unidad / servicio" sortBy="#{a.idUnidadCc.claveCc.descripcion}">
                        <h:outputText value="#{a.idUnidadCc.claveCc.claveCc}" styleClass="mono"/>
                        <h:outputText value=" #{a.idUnidadCc.claveCc.descripcion}"/>
                    </p:column>
                    <p:column headerText="Div./Sub." width="80">
                        <h:outputText value="#{a.division}-#{a.subdivision}" styleClass="mono"/>
                    </p:column>
                    <p:column headerText="Inmueble">
                        <h:outputText value="#{a.codigoUbicacion.descripcion}"/>
                    </p:column>
                    <p:column headerText="Clave UI" sortBy="#{a.idUnidadCc.claveUi.claveUi}" width="90">
                        <h:outputText value="#{a.idUnidadCc.claveUi.claveUi}" styleClass="mono"
                                      title="#{a.idUnidadCc.claveUi.descripcion}"/>
                    </p:column>
                    <p:column headerText="Región">
                        <h:outputText value="#{unidadesCtrl.region(a)}"/>
                    </p:column>
                    <p:column headerText="Régimen" width="110">
                        <h:outputText value="#{a.idUnidadCc.claveUi.tipoRegimen}"
                                      styleClass="estado #{a.idUnidadCc.claveUi.tipoRegimen eq 'ORDINARIO' ? 'estado-activo' : ''}"/>
                    </p:column>
                </p:dataTable>
            </section>

        </h:form>
    </ui:define>

</ui:composition>
