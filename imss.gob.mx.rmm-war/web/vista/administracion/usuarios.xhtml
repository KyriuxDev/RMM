<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces"
                template="/plantillas/plantillaPrincipal.xhtml">

    <!-- Administración → Usuarios (SD-07a)
         Alta (usuario nuevo) y edición (botón "Editar" de la tabla: editarDatos + asignarRol).
         validarCampos(): required + validadores del paquete "validadores" del WAR.
         Matrícula y correo se revisan contra la base al salir del campo (p:ajax change). -->
    <ui:param name="seccion" value="administracion"/>
    <ui:param name="subseccion" value="usuarios"/>
    <ui:param name="migaSeccion" value="Administración"/>
    <ui:param name="migaPagina" value="Usuarios"/>
    <ui:param name="titulo" value="Usuarios"/>

    <ui:define name="estilos">
        <h:outputStylesheet library="css" name="administracion/usuarios.css"/>
    </ui:define>

    <ui:define name="accionesEncabezado">
        <h:form id="formAcciones">
            <p:commandButton value="Nuevo usuario" icon="pi pi-user-plus"
                             action="#{adminCtrl.nuevoUsuario}"
                             process="@this" update=":formUsuarios:panelNuevo :formUsuarios:mensajes"
                             resetValues="true" styleClass="btn btn-primario"/>
        </h:form>
    </ui:define>

    <ui:define name="content">
        <h:form id="formUsuarios" styleClass="usuarios">

            <p:messages id="mensajes" showSummary="true" showDetail="true" globalOnly="true" closable="true"/>


            <!-- Formulario (alta o edición): sólo aparece con "Nuevo usuario" o "Editar" -->
            <p:outputPanel id="panelNuevo" layout="block">
            <h:panelGroup layout="block" styleClass="tarjeta" rendered="#{adminCtrl.formularioVisible}">
                <div class="tarjeta-titulo">
                    <h2>#{adminCtrl.editando ? 'Editar usuario' : 'Nuevo usuario'}</h2>
                    <h:outputText value="Editando a #{adminCtrl.nuevo.nombre}" styleClass="pastilla-edicion"
                                  rendered="#{adminCtrl.editando}"/>
                    <h:outputText value="Todos los campos son obligatorios" styleClass="tenue"
                                  rendered="#{not adminCtrl.editando}"/>
                </div>

                <div class="rejilla">
                    <div class="campo">
                        <p:outputLabel for="matricula" value="Matrícula"/>
                        <p:inputText id="matricula" value="#{adminCtrl.nuevo.matricula}" maxlength="10"
                                     required="true" requiredMessage="La matrícula es obligatoria"
                                     placeholder="Ej. 99214812" styleClass="mono">
                            <f:validator validatorId="matriculaValidator"/>
                            <f:validator validatorId="matriculaDisponibleValidator"/>
                            <f:attribute name="idExcluir" value="#{adminCtrl.idEditando}"/>
                            <p:ajax event="change" process="@this" update="@this msgMatricula"/>
                        </p:inputText>
                        <p:message id="msgMatricula" for="matricula"/>
                    </div>

                    <div class="campo campo-ancho">
                        <p:outputLabel for="nombre" value="Nombre completo"/>
                        <p:inputText id="nombre" value="#{adminCtrl.nuevo.nombre}" maxlength="255"
                                     required="true" requiredMessage="El nombre es obligatorio"
                                     placeholder="Ej. Tania Mishell Castillo Serna">
                            <f:validateLength minimum="3" maximum="255"/>
                        </p:inputText>
                        <p:message for="nombre"/>
                    </div>

                    <div class="campo campo-ancho">
                        <p:outputLabel for="correo" value="Correo institucional"/>
                        <p:inputText id="correo" value="#{adminCtrl.nuevo.correo}" maxlength="255"
                                     required="true" requiredMessage="El correo es obligatorio"
                                     placeholder="nombre.apellido@imss.gob.mx">
                            <f:validator validatorId="correoInstitucionalValidator"/>
                            <f:validator validatorId="correoDisponibleValidator"/>
                            <f:attribute name="idExcluir" value="#{adminCtrl.idEditando}"/>
                            <p:ajax event="change" process="@this" update="@this msgCorreo"/>
                        </p:inputText>
                        <p:message id="msgCorreo" for="correo"/>
                    </div>

                    <div class="campo">
                        <p:outputLabel for="rol" value="Rol"/>
                        <p:selectOneMenu id="rol" value="#{adminCtrl.idRol}"
                                         required="true" requiredMessage="Seleccione el rol">
                            <f:selectItem itemLabel="Seleccione..." itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{adminCtrl.roles}" var="r"
                                           itemValue="#{r.idRol}" itemLabel="#{r.nombre}"/>
                        </p:selectOneMenu>
                        <p:message for="rol"/>
                    </div>

                    <div class="campo campo-ancho">
                        <p:outputLabel for="contrasena"
                                       value="#{adminCtrl.editando ? 'Nueva contraseña (opcional)' : 'Contraseña temporal'}"/>
                        <p:password id="contrasena" value="#{adminCtrl.contrasena}" feedback="false"
                                    toggleMask="true" autocomplete="new-password"
                                    placeholder="#{adminCtrl.editando ? 'Déjela vacía para conservar la actual' : ''}"
                                    required="#{not adminCtrl.editando}" requiredMessage="La contraseña es obligatoria">
                            <f:validator validatorId="contrasenaValidator"/>
                        </p:password>
                        <p:message for="contrasena"/>
                    </div>

                    <!-- Estado: sólo al editar. Nadie puede desactivar su propia cuenta. -->
                    <h:panelGroup layout="block" styleClass="campo campo-casilla" rendered="#{adminCtrl.editando}">
                        <p:selectBooleanCheckbox id="estaActivo" value="#{adminCtrl.nuevo.estaActivo}"
                                                 disabled="#{adminCtrl.editandoseASiMismo}"/>
                        <p:outputLabel for="estaActivo" value="Usuario activo (puede iniciar sesión)"/>
                        <p:message for="estaActivo"/>
                    </h:panelGroup>
                </div>

                <div class="acciones">
                    <p:commandButton value="Cancelar" icon="pi pi-times"
                                     action="#{adminCtrl.cancelar}"
                                     process="@this" update="panelNuevo" resetValues="true"
                                     styleClass="btn btn-secundario"/>
                    <p:commandButton value="#{adminCtrl.editando ? 'Guardar cambios' : 'Guardar usuario'}"
                                     icon="#{adminCtrl.editando ? 'pi pi-save' : 'pi pi-user-plus'}"
                                     action="#{adminCtrl.guardarUsuario}"
                                     process="panelNuevo" update="panelNuevo mensajes tablaUsuarios"
                                     styleClass="btn btn-primario"/>
                </div>
            </h:panelGroup>
            </p:outputPanel>

            <!-- Filtro (estilo Zabbix): "Aplicar" o Enter -->
            <p:outputPanel id="panelFiltro" layout="block" styleClass="panel-filtro">
                <span class="pestana-filtro"><i class="pi pi-filter"></i> Filtro</span>
                <div class="campos-filtro">
                    <p:outputLabel for="texto" value="Buscar"/>
                    <p:inputText id="texto" value="#{adminCtrl.texto}" maxlength="100"
                                 placeholder="Nombre, matrícula o correo" autocomplete="off"/>

                    <p:outputLabel for="estadoFiltro" value="Estado"/>
                    <p:selectOneButton id="estadoFiltro" value="#{adminCtrl.estadoFiltro}">
                        <f:selectItem itemLabel="Todos" itemValue=""/>
                        <f:selectItem itemLabel="Activos" itemValue="ACTIVO"/>
                        <f:selectItem itemLabel="Inactivos" itemValue="INACTIVO"/>
                    </p:selectOneButton>

                    <p:outputLabel for="rolFiltro" value="Rol"/>
                    <p:selectOneButton id="rolFiltro" value="#{adminCtrl.idRolFiltro}" styleClass="ancho-completo">
                        <f:selectItem itemLabel="Todos" itemValue=""/>
                        <f:selectItems value="#{adminCtrl.roles}" var="r" itemValue="#{r.idRol}" itemLabel="#{r.nombre}"/>
                    </p:selectOneButton>
                </div>
                <div class="acciones-filtro">
                    <p:commandButton id="aplicar" value="Aplicar" action="#{adminCtrl.filtrar}"
                                     process="panelFiltro" update="tablaUsuarios"
                                     styleClass="btn btn-primario"/>
                    <p:commandButton value="Restablecer" action="#{adminCtrl.limpiarFiltros}"
                                     process="@this" update="panelFiltro tablaUsuarios" resetValues="true"
                                     styleClass="btn btn-contorno"/>
                </div>
                <p:defaultCommand target="aplicar" scope="panelFiltro"/>
            </p:outputPanel>

            <!-- Usuarios registrados -->
            <section class="tarjeta tarjeta-tabla">
                <p:dataTable id="tablaUsuarios" value="#{adminCtrl.usuarios}" var="u" styleClass="tabla-lista"
                             rows="25" paginator="true" paginatorPosition="bottom"
                             paginatorAlwaysVisible="false" rowsPerPageTemplate="25,50,100"
                             rowStyleClass="#{u.estaActivo ? '' : 'fila-inactiva'}"
                             currentPageReportTemplate="Mostrando {startRecord} a {endRecord} de {totalRecords} encontrados"
                             paginatorTemplate="{FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown} {CurrentPageReport}">
                    <f:facet name="emptyMessage">
                        <div class="sin-datos"><i class="pi pi-search"></i>No se encontraron datos</div>
                    </f:facet>
                    <p:column headerText="Matrícula" sortBy="#{u.matricula}" width="130">
                        <h:outputText value="#{u.matricula}" styleClass="mono"/>
                    </p:column>
                    <p:column headerText="Nombre" sortBy="#{u.nombre}">
                        <h:outputText value="#{u.nombre}"/>
                    </p:column>
                    <p:column headerText="Correo" sortBy="#{u.correo}">
                        <h:outputText value="#{u.correo}"/>
                    </p:column>
                    <p:column headerText="Rol" sortBy="#{u.idRol.nombre}" width="150">
                        <h:outputText value="#{u.idRol.nombre}"/>
                    </p:column>
                    <p:column headerText="Estado" width="110">
                        <h:outputText value="#{u.estaActivo ? 'Activo' : 'Inactivo'}"
                                      styleClass="estado #{u.estaActivo ? 'estado-activo' : 'estado-inactivo'}"/>
                    </p:column>
                    <!-- PR-18 "Editar": abre el formulario de arriba con sus datos -->
                    <p:column headerText="Acciones" styleClass="col-acciones">
                        <p:commandLink value="Editar" action="#{adminCtrl.editar(u)}" title="Editar"
                                       process="@this" update="formUsuarios:panelNuevo formUsuarios:mensajes"
                                       resetValues="true" styleClass="accion"
                                       oncomplete="window.scrollTo({top: 0, behavior: 'smooth'})"/>
                    </p:column>
                </p:dataTable>
            </section>

        </h:form>
    </ui:define>

</ui:composition>
