<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/plantillas/plantillaPrincipal.xhtml">

    <ui:param name="seccion" value="Tableros"/>
    <ui:param name="titulo" value="Monitoreo de Infraestructura y Equipos"/>

    <ui:define name="estilos">
        <h:outputStylesheet library="css" name="tablero.css"/>
    </ui:define>

    <ui:define name="acciones">
        <button type="button" class="btn btn-secundario"><i class="pi pi-clock"></i> Última hora</button>
        <button type="button" class="btn btn-primario"><i class="pi pi-pencil"></i> Editar</button>
    </ui:define>

    <ui:define name="content">
        <section class="tarjeta t-mapa">
            <div class="tarjeta-titulo">
                <h2>Geomapa</h2>
                <span class="mono tenue">17°04'N 96°43'W</span>
            </div>

            <div class="mapa-contenedor">
                <h:graphicImage library="img" name="Oaxaca.svg" alt="Mapa de Oaxaca"/>
            </div>

            <div class="tarjeta-pie">
                <h:link outcome="/vista/inventario" styleClass="enlace" value="Ver Inventario"/>
            </div>
        </section>
    </ui:define>

</ui:composition>
