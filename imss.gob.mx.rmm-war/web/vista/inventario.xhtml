<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                template="/plantillas/plantillaPrincipal.xhtml">

    <ui:param name="seccion" value="Inventario"/>
    <ui:param name="titulo" value="Dispositivos e Inventario"/>

    <ui:define name="estilos">
        <h:outputStylesheet library="css" name="inventario.css"/>
    </ui:define>

    <ui:define name="acciones">
        <button type="button" class="btn btn-secundario"><i class="pi pi-clock"></i> Última 1 hora</button>
        <span class="estado-sync"><span class="punto-ok"></span> Sincronizado 11:53:16</span>
    </ui:define>

    <ui:define name="content">
        <section class="tarjeta t-grafica">
            <div class="tarjeta-titulo">
                <h2>Equipos por estado</h2>
                <span class="tenue">1,248 equipos registrados</span>
            </div>

            <div class="grafica-contenedor">
                <!-- Pon aquí la imagen de la gráfica, por ejemplo:
                     <h:graphicImage library="img" name="grafica.png" alt="Gráfica"/> -->
                <span class="tenue">Espacio para la gráfica</span>
            </div>
        </section>
    </ui:define>

</ui:composition>
