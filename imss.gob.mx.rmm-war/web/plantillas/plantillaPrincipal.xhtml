<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html">

    <!-- f:metadata de cada vista (f:viewParam, f:viewAction) -->
    <ui:insert name="metadata"/>
    <h:head>
        <!-- Menú automático (se encoge) salvo que el usuario lo haya fijado; antes de pintar, para que no parpadee -->
        <script type="text/javascript">
            try { if (localStorage.getItem('rmm-menu') !== 'fijo') { document.documentElement.classList.add('menu-compacto'); } }
            catch (e) { document.documentElement.classList.add('menu-compacto'); }
        </script>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/svg+xml" href="#{resource['img:favicon.svg']}" />
        <h:outputStylesheet library="primefaces" name="primeicons/primeicons.css"/>
        <h:outputStylesheet library="css" name="comun/default.css"/>
        <h:outputStylesheet library="css" name="plantillas/principal.css"/>
        <ui:insert name="estilos"/>
        <!-- Al final: estilo tipo Zabbix (todo recto, filtros y tablas compactas) -->
        <h:outputStylesheet library="css" name="comun/listados.css"/>
        <title>#{titulo} | RMM IMSS</title>
    </h:head>

    <h:body>
        <div class="app">
            <ui:include src="/plantillas/partes/sidebar.xhtml"/>

            <div class="app-main">
                <ui:include src="/plantillas/partes/encabezado.xhtml"/>

                <main class="app-contenido">
                    <ui:insert name="content">Contenido</ui:insert>
                </main>
            </div>
        </div>
    </h:body>

</html>
